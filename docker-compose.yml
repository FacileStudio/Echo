services:
  echo-web:
    container_name: echo-web
    build:
      context: .
    restart: unless-stopped
    expose:
    - '80'
    environment:
    - PUBLIC_URL
    - XMPP_DOMAIN
    - XMPP_AUTH_DOMAIN
    - XMPP_GUEST_DOMAIN
    - XMPP_MUC_DOMAIN
    - XMPP_BOSH_URL_BASE
    networks:
      echo: null
      dokploy-network: null
    depends_on:
    - echo-jvb
    - echo-ai-proxy
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '80'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  echo-prosody:
    container_name: echo-prosody
    image: jitsi/prosody:${JITSI_IMAGE_VERSION:-stable}
    restart: unless-stopped
    expose:
    - '5222'
    - '5269'
    - '5347'
    - '5280'
    volumes:
    - ${CONFIG}/prosody/config:/config:Z
    - ${CONFIG}/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z
    environment:
    - ENABLE_AUTH=${ENABLE_AUTH:-0}
    - ENABLE_GUESTS=${ENABLE_GUESTS:-1}
    - ENABLE_BREAKOUT_ROOMS=1
    - ENABLE_END_CONFERENCE=1
    - ENABLE_LOBBY=1
    - ENABLE_XMPP_WEBSOCKET=1
    - ENABLE_TRANSCRIPTIONS=1
    - AUTH_TYPE=${AUTH_TYPE:-internal}
    - JIGASI_XMPP_USER=jigasi
    - JIGASI_XMPP_PASSWORD=${JIGASI_XMPP_PASSWORD}
    - JIGASI_TRANSCRIBER_PASSWORD=${JIGASI_XMPP_PASSWORD}
    - JICOFO_AUTH_PASSWORD
    - JVB_AUTH_USER
    - JVB_AUTH_PASSWORD
    - PUBLIC_URL
    - TZ
    - XMPP_DOMAIN
    - XMPP_AUTH_DOMAIN
    - XMPP_GUEST_DOMAIN
    - XMPP_MUC_DOMAIN
    - XMPP_INTERNAL_MUC_DOMAIN
    - XMPP_HIDDEN_DOMAIN=hidden.meet.jitsi
    - XMPP_PORT
    - XMPP_RECORDER_DOMAIN
    networks:
      echo:
        aliases:
        - ${XMPP_SERVER:-xmpp.meet.jitsi}
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '5222'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  echo-jicofo:
    container_name: echo-jicofo
    image: jitsi/jicofo:${JITSI_IMAGE_VERSION:-stable}
    restart: unless-stopped
    volumes:
    - ${CONFIG}/jicofo:/config:Z
    environment:
    - AUTH_TYPE=${AUTH_TYPE:-internal}
    - ENABLE_AUTH=${ENABLE_AUTH:-0}
    - ENABLE_AUTO_OWNER=1
    - ENABLE_RECORDING=0
    - ENABLE_SCTP=1
    - ENABLE_TRANSCRIPTIONS=1
    - JIGASI_BREWERY_MUC=jigasibrewery
    - JIGASI_SIP_URI=location@location
    - JICOFO_AUTH_PASSWORD
    - JICOFO_ENABLE_BRIDGE_HEALTH_CHECKS=true
    - JICOFO_ENABLE_HEALTH_CHECKS=true
    - JVB_BREWERY_MUC
    - TZ
    - XMPP_DOMAIN
    - XMPP_AUTH_DOMAIN
    - XMPP_INTERNAL_MUC_DOMAIN
    - XMPP_MUC_DOMAIN
    - XMPP_HIDDEN_DOMAIN
    - XMPP_SERVER
    - XMPP_PORT
    depends_on:
    - echo-prosody
    networks:
      echo: null
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '3000'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  echo-jvb:
    container_name: echo-jvb
    image: jitsi/jvb:${JITSI_IMAGE_VERSION:-stable}
    restart: unless-stopped
    ports:
    - ${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp
    volumes:
    - ${CONFIG}/jvb:/config:Z
    environment:
    - ENABLE_COLIBRI_WEBSOCKET=1
    - ENABLE_SCTP=1
    - JVB_ADVERTISE_IPS=${JVB_ADVERTISE_IPS}
    - JVB_AUTH_USER
    - JVB_AUTH_PASSWORD
    - JVB_BREWERY_MUC
    - JVB_PORT
    - JVB_STUN_SERVERS
    - PUBLIC_URL
    - TZ
    - XMPP_AUTH_DOMAIN
    - XMPP_INTERNAL_MUC_DOMAIN
    - XMPP_SERVER
    - XMPP_PORT
    depends_on:
    - echo-prosody
    networks:
      echo: null
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - ${JVB_PORT
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  echo-vosk:
    container_name: echo-vosk
    image: alphacep/kaldi-fr:latest
    restart: unless-stopped
    expose:
    - '2700'
    networks:
      echo: null
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '2700'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  echo-jigasi:
    container_name: echo-jigasi
    image: jitsi/jigasi:${JITSI_IMAGE_VERSION:-stable}
    restart: unless-stopped
    volumes:
    - ${CONFIG}/jigasi:/config:Z
    environment:
    - JIGASI_MODE=transcriber
    - ENABLE_TRANSCRIPTIONS=1
    - JIGASI_ENABLE_SDES_SRTP=0
    - JIGASI_SIP_KEEP_ALIVE_METHOD=OPTIONS
    - JIGASI_TRANSCRIBER_ADVERTISE_URL=0
    - JIGASI_TRANSCRIBER_RECORD_AUDIO=0
    - JIGASI_TRANSCRIBER_SEND_TXT=1
    - JIGASI_XMPP_USER=jigasi
    - JIGASI_XMPP_PASSWORD=${JIGASI_XMPP_PASSWORD}
    - JIGASI_BREWERY_MUC=jigasibrewery
    - JIGASI_TRANSCRIBER_PASSWORD=${JIGASI_XMPP_PASSWORD}
    - JIGASI_TRANSCRIBER_CUSTOM_SERVICE=org.jitsi.jigasi.transcription.VoskTranscriptionService
    - JIGASI_TRANSCRIBER_VOSK_URL=ws://echo-vosk:2700
    - XMPP_HIDDEN_DOMAIN=hidden.meet.jitsi
    - TZ
    - XMPP_AUTH_DOMAIN
    - XMPP_DOMAIN
    - XMPP_GUEST_DOMAIN
    - XMPP_INTERNAL_MUC_DOMAIN
    - XMPP_MUC_DOMAIN
    - XMPP_SERVER
    - XMPP_PORT
    - PUBLIC_URL
    depends_on:
    - echo-prosody
    - echo-vosk
    networks:
      echo: null
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '3000'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  echo-ai-proxy:
    container_name: echo-ai-proxy
    image: oven/bun:latest
    restart: unless-stopped
    expose:
    - '3100'
    environment:
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
    - ./ai-proxy.ts:/app/index.ts:ro
    command: bun run /app/index.ts
    networks:
      echo: null
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '3100'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
networks:
  echo: null
  dokploy-network:
    external: true
