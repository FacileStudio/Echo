[tools]
go = "1.26"
bun = "1"

# local overrides (ANTHROPIC_API_KEY, OIDC_*) go in .env, which is gitignored
[env]
_.file = ".env"

[tasks.dev]
description = "Run Postgres, LiveKit, the API and the client locally"
depends = ["dev:api", "dev:client"]

[tasks."dev:services"]
description = "Start local Postgres and LiveKit in docker"
run = "docker compose -f deploy/compose/dev.yml up -d --wait"

[tasks."dev:api"]
description = "Run the API against the local services"
depends = ["dev:services"]
dir = "apps/api"
run = "go run ."

[tasks."dev:api".env]
PORT = "8080"
DATABASE_URL = "postgres://echo:echo@localhost:5433/echo?sslmode=disable"
CORS_ALLOWED_ORIGINS = "http://localhost:5173"
LIVEKIT_URL = "ws://localhost:7880"
LIVEKIT_API_KEY = "devkey"
LIVEKIT_API_SECRET = "secret"
RECORDINGS_DIR = "../../data/recordings"

[tasks."dev:client"]
description = "Run the SvelteKit dev server"
depends = ["install"]
dir = "apps/client"
run = "bun run dev"

[tasks."dev:down"]
description = "Stop the local services"
run = "docker compose -f deploy/compose/dev.yml down"

[tasks.install]
description = "Install client dependencies"
run = 'cd apps/client && bun install --frozen-lockfile'

[tasks.models]
description = "Download the Vosk models in-browser transcription loads (about 80 MB, not committed)"
run = "sh scripts/vosk-models.sh apps/client/static/models"

[tasks.check]
description = "Run the full quality gate: every Go module, then the client"
run = "sh ./scripts/check.sh"

[tasks.check-go]
description = "Run the Go half of the quality gate"
run = "sh ./scripts/check.sh --go-only"

[tasks.format]
description = "Format the Go sources in place"
run = "sh ./scripts/check.sh --format"
