services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: echo
    volumes:
    - echo-pg:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '5432'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  echo:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://echo:${DB_PASSWORD}@postgres:5432/echo?sslmode=disable
      PORT: '4020'
      CLIENT_DIR: /client
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ALLOW_REGISTRATION: 'true'
      LOG_LEVEL: info
      TRANSCRIBER_TOKEN: ${TRANSCRIBER_TOKEN:?TRANSCRIBER_TOKEN is required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      RECORDINGS_DIR: /recordings
    volumes:
    - echo-recordings:/recordings:ro
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '4020'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  transcriber:
    build:
      context: ../../services/transcriber
    restart: unless-stopped
    depends_on:
    - echo
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      VOSK_MODEL_PATH: /models/vosk-model-small-fr-0.22
      ECHO_API_URL: http://echo:4020
      TRANSCRIBER_TOKEN: ${TRANSCRIBER_TOKEN:?TRANSCRIBER_TOKEN is required}
    volumes:
    - vosk-model-nonroot:/models
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  egress:
    image: livekit/egress:v1.13.0
    restart: unless-stopped
    network_mode: host
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
    - ./egress.yaml:/etc/egress.yaml:ro
    - echo-recordings:/output
    cap_add:
    - SYS_ADMIN
    shm_size: 2gb
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '3000'
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  echo-pg: null
  vosk-model-nonroot: null
  echo-recordings: null
