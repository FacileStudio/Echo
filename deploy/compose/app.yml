services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: echo
    volumes:
    - echo-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  echo:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://echo:${DB_PASSWORD}@postgres:5432/echo?sslmode=disable
      PORT: '4020'
      CLIENT_DIR: /client
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      LOG_LEVEL: info
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      RECORDINGS_DIR: /recordings
      ECHO_INTEGRATION_KEYS: ${ECHO_INTEGRATION_KEYS:-}
      ECHO_EMBED_ORIGINS: ${ECHO_EMBED_ORIGINS:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      # Hops whose X-Forwarded-For is believed: Traefik's private network and
      # Cloudflare's edge. The join rate limit additionally reads
      # Cf-Connecting-Ip when Traefik forwarded a request from a Cloudflare edge.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private,cloudflare}
    volumes:
    - echo-recordings:/recordings
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  recordings-perms:
    image: busybox:1.37
    command: ["chmod", "0777", "/output"]
    volumes:
    - echo-recordings:/output
    restart: "no"
  egress:
    image: livekit/egress:v1.13.0
    restart: unless-stopped
    depends_on:
      recordings-perms:
        condition: service_completed_successfully
    network_mode: host
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
    - ./egress.yaml:/etc/egress.yaml:ro
    - echo-recordings:/output
    cap_add:
    - SYS_ADMIN
    shm_size: 2gb
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
volumes:
  echo-pg: null
  echo-recordings: null
