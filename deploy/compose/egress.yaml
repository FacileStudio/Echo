# Config for the livekit/egress container in app.yml.
#
# Recordings land in /output, where the echo-recordings volume is mounted here.
# The API mounts that same volume read-only at /recordings (RECORDINGS_DIR) and
# opens the basename of the stored path inside it, so egress must write flat
# into /output and the StartEgress filepath must be absolute — a relative one
# resolves against this container's working directory, outside the volume.
log_level: info
api_key: ${LIVEKIT_API_KEY}
api_secret: ${LIVEKIT_API_SECRET}
ws_url: ws://127.0.0.1:7880
insecure: true
redis:
  address: 127.0.0.1:6379
health_port: 7899
